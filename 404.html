<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data: https://jijuuhuju.github.io; connect-src 'self'"
    >

    <title>404 · Streech</title>

    <style type="text/css">
      body {
        background-color: #00d631;
        margin: 0;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #ffffff;
      }

      .container {
        margin: 60px auto 40px auto;
        width: 600px;
        max-width: calc(100% - 40px);
        text-align: center;
      }

      .logo {
        display: inline-block;
        margin-bottom: 25px;
      }

      .logo img {
        width: 100px;
        height: 100px;
      }

      h1 {
        margin: 0;
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -3px;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
      }

      h2 {
        margin: 10px 0 25px 0;
        font-size: 28px;
        font-weight: 600;
      }

      p {
        margin: 18px 0;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.9);
        font-size: 16px;
      }

      .box {
        margin: 30px auto;
        padding: 22px;
        background: rgba(255, 255, 255, 0.16);
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        backdrop-filter: blur(5px);
      }

      .button {
        display: inline-block;
        margin-top: 10px;
        padding: 12px 24px;
        background: #ffffff;
        color: #00a928;
        border-radius: 10px;
        font-weight: bold;
        text-decoration: none;
        transition: transform 0.15s, box-shadow 0.15s;
      }

      .button:hover {
        text-decoration: none;
        transform: translateY(-2px);
        box-shadow: 0 5px 12px rgba(0, 0, 0, 0.18);
      }

      .footer {
        margin-top: 35px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
      }

      .footer a {
        color: #ffffff;
        text-decoration: underline;
      }

      .footer a:hover {
        opacity: 0.8;
      }
    </style>
  </head>

  <body>

    <div class="container">

      <a href="/" class="logo">
        <img
          src="https://jijuuhuju.github.io/Streech-home/streech.svg"
          alt="Streech"
          title="Streech"
        >
      </a>

      <h1>404</h1>

      <h2>ページが見つかりません</h2>

      <div class="box">
        <p>
          おっと！Streechはこのページを見つけられませんでした。
        </p>

        <p>
          URLが間違っているか、サイトが更新された可能性があります
        </p>

        <a href="/" class="button">
          Streechホームへ戻る
        </a>
      </div>

      <div class="footer">
        <p>
          Powered by <strong>Streech</strong>
        </p>
      </div>

    </div>

  </body>
</html>
